on:
  push:
    branches:
      - main
  schedule:
    # Run every saturday at 4 AM UTC
    - cron: '0 4 * * 6'
  workflow_dispatch:

jobs:
  docker-compose:
    environment: Prod
    runs-on: [self-hosted, Linux, np-prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy device definition files
        run: cp ./server/config.example/devices.yaml ${{ vars.CONFIG_DIR }}/devices.yaml

      - name: Run Docker Compose
        env:
          CONFIG_DIR: ${{ vars.CONFIG_DIR }}
          DATA_DIR: ${{ vars.DATA_DIR }}
          HUB_PORT: ${{ vars.HUB_PORT }}
        run: |
          docker compose -f docker-compose.yml -p nerdpraat-hamp up --build -d
      
      - name: Clean up unused Docker resources
        run: docker system prune -f
