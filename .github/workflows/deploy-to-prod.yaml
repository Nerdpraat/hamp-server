on:
  push:
    branches:
      - main
  schedule:
    # Run every saturday at 4 AM UTC
    - cron: '0 4 * * 6'
  workflow_dispatch:

jobs:
  docker-compose:
    runs-on: [self-hosted, Linux, np-prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Docker Compose
        env:
          CONFIG_DIR: ${{ vars.CONFIG_DIR }}
          DATA_DIR: ${{ vars.DATA_DIR }}
          HUB_PORT: ${{ vars.HUB_PORT }}
        run: |
          sudo -E docker compose -f docker-compose.yml -p nerdpraat-hamp up --build -d -e CONFIG_DIR=${CONFIG_DIR} -e DATA_DIR=${DATA_DIR} -e HUB_PORT=${HUB_PORT}
      
      - name: Clean up unused Docker resources
        run: sudo -E docker system prune -f
